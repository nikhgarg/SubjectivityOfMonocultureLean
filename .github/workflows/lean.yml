name: Lean
on: [push, pull_request]
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-24.04
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: 'false'
          build: 'true'
          build-args: JGR26SubjectivityMonoculture
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Check all advertised proofs and their axioms
        run: lake env lean ProofChecks.lean

  audit-schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the audit schema validator
        run: python3 -m pip install --disable-pip-version-check -r audit/requirements.txt
      - name: Verify schema copies and the complete code inventory
        run: python3 audit/verify_audit_source.py
